services:
  - type: web
    name: voice-authenticity-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: HF_TOKEN
        sync: false
      - key: HF_DATASET_REPO
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
